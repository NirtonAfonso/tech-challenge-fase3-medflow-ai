[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medflow-ai"
version = "0.1.0"
description = "Tech Challenge Fase 3 - assistente clínico acadêmico com Fine-Tuning, RAG, LangChain e LangGraph"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
